server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/net_disk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置（新增，未改动上方数据源/Redis 配置）
jwt:
  # HS256 要求密钥长度至少 256 位(32 字节)，太短启动会报错
  secret: netDisk2026PersonalCloudStorageProjectSecretKeyLijunxian
  # token 过期时间，单位毫秒，7 天 = 7 * 24 * 60 * 60 * 1000
  expire: 604800000
