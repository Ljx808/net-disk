server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/net_disk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置（新增，未改动上方数据源/Redis 配置）
jwt:
  # HS256 要求密钥长度至少 256 位(32 字节)，太短启动会报错
  secret: ${JWT_SECRET:netDisk2026PersonalCloudStorageProjectSecretKeyLijunxian}
  # token 过期时间，单位毫秒，7 天 = 7 * 24 * 60 * 60 * 1000
  expire: 604800000

# 文件存储配置（新增）
net-disk:
  storage:
    # 文件实际落盘的根目录。故意用绝对路径，避免"相对路径到底相对于谁"的困惑
    # （相对路径在 IDE 里跑和打成 jar 跑，基准目录是不一样的，最容易踩坑）
    # 想换存储位置只改这一行，代码里没有硬编码
    root-path: D:/net-disk-storage
